<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARK Website</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-cover bg-center" style="background-image: url('path-to-your-animated-background');">
    <header class="text-white bg-transparent p-10 text-center">
        <h1 class="text-4xl font-bold">Welcome to BARK</h1>
        <p class="mt-2 text-lg">Your gateway to decentralized finance.</p>
    </header>

    <section id="tokenomics" class="py-20 bg-gray-800">
        <div class="container mx-auto text-center">
            <h2 class="text-3xl font-semibold text-white">Tokenomics</h2>
            <p class="mt-4 text-white">Details about token distribution, utility, and governance.</p>
        </div>
    </section>

    <section id="roadmap" class="py-20">
        <div class="container mx-auto text-center">
            <h2 class="text-3xl font-semibold">Roadmap</h2>
            <p class="mt-4">Our journey toward the future of finance.</p>
        </div>
    </section>

    <footer class="text-center bg-gray-900 p-10">
        <h2 class="text-xl font-semibold text-white">Get Started with BARK</h2>
        <button class="mt-4 bg-blue-500 text-white font-bold py-2 px-4 rounded">Join Now</button>
    </footer>
</body>
</html>
